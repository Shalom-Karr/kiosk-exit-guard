name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Generate UAC manifest .syso
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;$(go env GOPATH)\bin"
          goversioninfo -64 versioninfo.json

      - name: Build kiosk-exit-guard.exe
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-H windowsgui -s -w" -o kiosk-exit-guard.exe .

      # v1.1.8 CRITICAL#2: publish a sidecar SHA-256 file alongside the
      # exe so the in-app `--update` flow can verify integrity before
      # replacing the running binary. fetchExpectedSHA256 in main.go
      # reads the first whitespace-delimited token, so the canonical
      # Get-FileHash output ("HEX") works directly. ASCII / no BOM /
      # no trailing newline (-NoNewline) keeps the file as small and
      # parser-tolerant as possible.
      - name: Generate SHA-256 sidecar
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 kiosk-exit-guard.exe).Hash.ToLower()
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'kiosk-exit-guard.exe.sha256'),
            $hash,
            [System.Text.UTF8Encoding]::new($false))

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            kiosk-exit-guard.exe
            kiosk-exit-guard.exe.sha256
          generate_release_notes: true
          name: ${{ env.RELEASE_TAG }}
